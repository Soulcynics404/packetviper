[package]
name = "packetviper-relay"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Tiny relay server so PacketViper alerts reach your phone anywhere (not just on the LAN)"

[[bin]]
name = "packetviper-relay"
path = "src/main.rs"

# Minimal: std plus sha2 only (for stateless room auth — never hand-roll crypto). Easy to deploy.
[dependencies]
sha2 = "0.10"
